name: build llvm single stage

# One-off bootstrap for LLVM 23.1.1 on GitHub's six-hour Intel runner. Homebrew's
# regular unversioned LLVM formula uses a multi-stage PGO/LTO build that needs far
# longer than the hosted runner permits. This workflow changes only pgo_build to
# false in the disposable runner checkout; the published bottle remains LLVM 23.1.1.

on:
  workflow_dispatch:

concurrency:
  # Share the normal build queue so a scheduled build cannot start another LLVM
  # source build or race this workflow while it publishes to homebrew-core.
  group: build-bottles
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  llvm:
    name: LLVM 23.1.1 non-PGO bootstrap
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: >-
        [{"formula":"llvm","labels":["macos-15-intel"],"timeout":350,"profile":"llvm-single-stage"}]
      stage: llvm-single-stage
      allow_failure: false
      release_tag: bottles
      llvm_single_stage: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
