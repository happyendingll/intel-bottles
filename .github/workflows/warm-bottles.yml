name: warm optional bottles

# Optional prewarming starts only after the catalog has been regenerated following a
# successful held-refresh build. Manual runs remain available for explicit validation batches.

on:
  workflow_dispatch:
    inputs:
      formulae:
        description: Space-separated catalog formulae to test instead of the daily selection
        required: false
        type: string
      limit:
        description: Maximum number of optional root formulae to prewarm
        required: true
        default: 100
        type: number
  workflow_run:
    workflows: ["generate prewarm catalog"]
    types: [completed]

concurrency:
  group: warm-bottles
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  plan:
    name: plan optional catalog
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15-intel
    outputs:
      wave0: ${{ steps.plan.outputs.wave0 }}
      wave1: ${{ steps.plan.outputs.wave1 }}
      wave2: ${{ steps.plan.outputs.wave2 }}
      wave3: ${{ steps.plan.outputs.wave3 }}
      wave4: ${{ steps.plan.outputs.wave4 }}
    env:
      HOMEBREW_CORE_GIT_REMOTE: https://github.com/${{ github.repository_owner }}/homebrew-core
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ASK: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Download catalog pipeline context
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: pipeline-context
          path: ${{ runner.temp }}/pipeline-context
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create pipeline context for a manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/pipeline-context"
          python3 scripts/pipeline_context.py create \
            --output "$RUNNER_TEMP/pipeline-context/pipeline-context.json" \
            --stage warm \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Add warm run to pipeline context
        if: github.event_name == 'workflow_run'
        run: |
          python3 scripts/pipeline_context.py conclude \
            "$RUNNER_TEMP/pipeline-context/pipeline-context.json" \
            --stage catalog \
            --conclusion "${{ github.event.workflow_run.conclusion }}"
          python3 scripts/pipeline_context.py stamp \
            "$RUNNER_TEMP/pipeline-context/pipeline-context.json" \
            --stage warm \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Keep pipeline context for the final report
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-context
          path: ${{ runner.temp }}/pipeline-context/pipeline-context.json
          retention-days: 7

      - name: Point Homebrew at the fork
        run: ./scripts/prepare_homebrew.sh

      - name: Select optional Formulae
        id: plan
        env:
          OVERRIDE: ${{ inputs.formulae }}
          WARM_LIMIT: ${{ inputs.limit || 100 }}
        run: python3 scripts/plan_catalog.py

  wave0:
    name: wave 0
    needs: plan
    if: needs.plan.outputs.wave0 != '[]' && needs.plan.outputs.wave0 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave0 }}
      stage: warm-wave0
      release_tag: bottles-warm-2
      allow_failure: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave1:
    name: wave 1
    needs: [plan, wave0]
    if: always() && needs.plan.outputs.wave1 != '[]' && needs.plan.outputs.wave1 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave1 }}
      stage: warm-wave1
      release_tag: bottles-warm-2
      allow_failure: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave2:
    name: wave 2
    needs: [plan, wave1]
    if: always() && needs.plan.outputs.wave2 != '[]' && needs.plan.outputs.wave2 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave2 }}
      stage: warm-wave2
      release_tag: bottles-warm-2
      allow_failure: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave3:
    name: wave 3
    needs: [plan, wave2]
    if: always() && needs.plan.outputs.wave3 != '[]' && needs.plan.outputs.wave3 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave3 }}
      stage: warm-wave3
      release_tag: bottles-warm-2
      allow_failure: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave4:
    name: wave 4
    needs: [plan, wave3]
    if: always() && needs.plan.outputs.wave4 != '[]' && needs.plan.outputs.wave4 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave4 }}
      stage: warm-wave4
      release_tag: bottles-warm-2
      allow_failure: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  report:
    name: email pipeline report
    needs: [plan, wave0, wave1, wave2, wave3, wave4]
    # Reporting is the terminal safety net. It must run after failed/cancelled waves and
    # also when catalog generation failed and the warm plan was therefore skipped.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download pipeline context from this warm run
        id: warm-context
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pipeline-context
          path: ${{ runner.temp }}/pipeline-context

      - name: Recover context from the catalog run
        if: >-
          steps.warm-context.outcome != 'success' &&
          github.event_name == 'workflow_run'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: pipeline-context
          path: ${{ runner.temp }}/pipeline-context
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Normalize report context
        run: |
          context="$RUNNER_TEMP/pipeline-context/pipeline-context.json"
          if [ ! -f "$context" ]; then
            python3 scripts/pipeline_context.py create \
              --output "$context" \
              --stage warm \
              --run-id "$GITHUB_RUN_ID" \
              --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ]; then
            python3 scripts/pipeline_context.py stamp \
              "$context" \
              --stage catalog \
              --run-id "${{ github.event.workflow_run.id }}" \
              --run-url "${{ github.event.workflow_run.html_url }}"
            python3 scripts/pipeline_context.py conclude \
              "$context" \
              --stage catalog \
              --conclusion "${{ github.event.workflow_run.conclusion }}"
          fi
          python3 scripts/pipeline_context.py stamp \
            "$context" \
            --stage warm \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Build the final report
        run: |
          python3 scripts/pipeline_context.py report \
            "$RUNNER_TEMP/pipeline-context/pipeline-context.json" \
            --warm-results "plan=${{ needs.plan.result }},wave0=${{ needs.wave0.result }},wave1=${{ needs.wave1.result }},wave2=${{ needs.wave2.result }},wave3=${{ needs.wave3.result }},wave4=${{ needs.wave4.result }}" \
            --output "$RUNNER_TEMP/pipeline-report.md"
          cat "$RUNNER_TEMP/pipeline-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Send one GitHub email notification
        uses: actions/github-script@v8
        env:
          REPORT_PATH: ${{ runner.temp }}/pipeline-report.md
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync(process.env.REPORT_PATH, "utf8");
            const { owner, repo } = context.repo;
            const label = "pipeline-report";
            const marker = "<!-- intel-bottles-pipeline-report -->";

            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: "1D76DB",
                description: "Daily Intel bottle pipeline reports",
              });
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: "open", labels: label, per_page: 100,
            });
            const existing = issues.find(issue =>
              !issue.pull_request && (issue.body || "").includes(marker)
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `@${owner}\n\n${report}`,
              });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: "Intel bottle 自动编译链路报告",
                body: `@${owner}\n\n${marker}\n\n${report}`,
                labels: [label],
              });
            }
