name: build stage

# Reusable: builds one stage's root formulae, then publishes everything that stage produced.
# Called twice by build-bottles.yml -- once for shared/heavy roots, once for the rest, so the
# second stage pours the first stage's output instead of rebuilding it.

on:
  workflow_call:
    inputs:
      formulae:
        description: JSON array of root formulae to build
        required: true
        type: string
      stage:
        description: Stage name, used in job titles and commit messages
        required: true
        type: string
      allow_failure:
        description: Let a failing formula pass the stage (used for the heavy roots)
        type: boolean
        default: false
      release_tag:
        description: Rolling Release family; publish selects the current numbered tag
        type: string
        default: bottles
      llvm_single_stage:
        description: Disable LLVM's multi-stage PGO build for the one-off Intel bootstrap
        type: boolean
        default: false
    secrets:
      FORK_TOKEN:
        description: PAT with contents:write on the homebrew-core fork
        required: true

env:
  BOTTLE_ROOT_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.release_tag }}
  EXPECTED_BOTTLE_TAG: sequoia
  RELEASE_TAG: ${{ inputs.release_tag }}
  BOTTLES_REPO: ${{ github.repository }}
  FORK_REPO: ${{ github.repository_owner }}/homebrew-core
  HOMEBREW_CORE_GIT_REMOTE: https://github.com/${{ github.repository_owner }}/homebrew-core
  HOMEBREW_NO_INSTALL_FROM_API: 1
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_ASK: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  # 5 made every stalled fetch take longer; the mirrors either answer or they do not.
  HOMEBREW_CURL_RETRIES: 2

jobs:
  build:
    # Each matrix entry carries its own runner, so qtwebengine can go to a self-hosted
    # Intel machine (no 6-hour ceiling) while everything else stays on GitHub's free
    # macos-15-intel. See runners.json.
    name: ${{ inputs.stage }} / ${{ matrix.entry.formula }}
    runs-on: ${{ matrix.entry.labels }}
    timeout-minutes: ${{ matrix.entry.timeout }}
    continue-on-error: ${{ inputs.allow_failure }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        entry: ${{ fromJSON(inputs.formulae) }}
    steps:
      - uses: actions/checkout@v7

      - name: Report disk
        # Kept as one line for diagnostics. There used to be an Xcode-deleting cleanup
        # step here, added on GitHub's documented 14 GB figure; the runner actually has
        # ~160 GB free, so it cost ~5 min a job (3.1 h across a full run) for nothing.
        run: df -h /

      - name: Point Homebrew at the fork
        run: |
          ./scripts/prepare_homebrew.sh
          git -C "$(brew --repo homebrew/core)" remote -v
          actual_tag="$(brew ruby -e 'puts Utils::Bottles.tag')"
          echo "bottle tag: $actual_tag"
          if [ "$actual_tag" != "$EXPECTED_BOTTLE_TAG" ]; then
            echo "ERROR: expected bottle tag $EXPECTED_BOTTLE_TAG, got $actual_tag" >&2
            exit 1
          fi

      - name: Patch LLVM for a single-stage build
        if: inputs.llvm_single_stage && matrix.entry.formula == 'llvm'
        run: |
          formula="$(brew --repo homebrew/core)/Formula/l/llvm.rb"
          python3 scripts/patch_llvm_single_stage.py \
            --expected-version 23.1.1 \
            "$formula"
          brew ruby -- -c "$formula"
          git -C "$(brew --repo homebrew/core)" diff --check -- Formula/l/llvm.rb
          git -C "$(brew --repo homebrew/core)" diff -- Formula/l/llvm.rb

      - name: Build and bottle
        env:
          BOTTLE_OUT_DIR: ${{ github.workspace }}/bottles
        run: ./scripts/build_root.sh "${{ matrix.entry.formula }}"

      - name: Upload bottles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bottles-${{ inputs.stage }}-${{ matrix.entry.formula }}
          path: bottles/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: publish ${{ inputs.stage }}
    needs: build
    if: always()
    runs-on: macos-15-intel
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: bottles-${{ inputs.stage }}-*
          path: bottles/
          # Unmerged: one directory per job. Merging collapses same-named bottles from
          # jobs that each built a shared dependency, which is how a tarball and a
          # checksum from different builds got published together.
          merge-multiple: false

      - name: Point Homebrew at the fork
        run: ./scripts/prepare_homebrew.sh

      - name: Authenticate the fork remote
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$(brew --repo homebrew/core)" remote set-url origin \
            "https://x-access-token:${{ secrets.FORK_TOKEN }}@github.com/${FORK_REPO}.git"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOTTLE_DIR: ${{ github.workspace }}/bottles
          STAGE: ${{ inputs.stage }}
        run: ./scripts/publish.sh

      - name: Record manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ls bottles/.staged/*.bottle.json >/dev/null 2>&1; then
            replaced="$RUNNER_TEMP/replaced-manifests"
            rm -rf -- "$replaced"
            mkdir -p "$replaced"
            for new in bottles/.staged/*.bottle.json; do
              base="$(basename "$new")"
              formula="${base%%--*}"
              for old in manifest/"$formula"--*.bottle.json; do
                [ -e "$old" ] || continue
                [ "$(basename "$old")" = "$base" ] && continue
                # Only current manifests are operational; Git history retains replaced ones.
                cp "$old" "$replaced/"
                rm -- "$old"
              done
            done
            cp bottles/.staged/*.bottle.json manifest/
            git add manifest/
            if [ -n "$(git status --porcelain)" ]; then
              git commit -m "manifest: ${{ inputs.stage }} ($(date -u +%Y-%m-%d))"
              git pull --rebase --autostash
              git push
            fi
          fi

      - name: Delete replaced bottle assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 scripts/delete_replaced_assets.py
          --candidates "$RUNNER_TEMP/replaced-manifests"

      - name: Record prewarm failures
        if: always() && startsWith(inputs.stage, 'warm-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STAGE: ${{ inputs.stage }}
        run: |
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            > "$RUNNER_TEMP/prewarm-jobs.json"
          python3 scripts/update_prewarm_failures.py \
            --stage "$STAGE" \
            --jobs-json "$RUNNER_TEMP/prewarm-jobs.json"
          git add prewarm-failures.txt
          if ! git diff --cached --quiet; then
            git commit -m "prewarm failures: $STAGE ($(date -u +%Y-%m-%d))"
            git pull --rebase --autostash
            git push
          fi
