name: sync fork

# Keeps the repository owner's homebrew-core fork equal to upstream plus our bottle blocks.
# Runs daily so new formula versions arrive; anything whose version moved loses its stale
# bottle here and gets picked up by the next build run.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 14 * * *"

concurrency:
  group: sync-fork
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: macos-15-intel
    env:
      FORK_REPO: ${{ github.repository_owner }}/homebrew-core
      HOMEBREW_CORE_GIT_REMOTE: https://github.com/${{ github.repository_owner }}/homebrew-core
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ASK: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Point Homebrew at the fork (retry once)
        run: ./scripts/retry.sh ./scripts/prepare_homebrew.sh

      - name: Authenticate the fork remote
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$(brew --repo homebrew/core)" remote set-url origin \
            "https://x-access-token:${{ secrets.FORK_TOKEN }}@github.com/${FORK_REPO}.git"

      - name: Sync (retry once)
        run: ./scripts/retry.sh ./scripts/sync_fork.sh

      - name: Record held refresh queue
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add targets.txt
          if ! git diff --cached --quiet; then
            git commit -m "targets: refresh held bottles ($(date -u +%Y-%m-%d))"
            ./scripts/retry.sh git pull --rebase --autostash
            ./scripts/retry.sh git push
          else
            echo "targets.txt already matches the held queue"
          fi

      - name: Retire obsolete manifests
        run: |
          python3 scripts/apply_manifest.py > "$RUNNER_TEMP/sync-plan.tsv"
          python3 scripts/retire_manifests.py \
            --plan "$RUNNER_TEMP/sync-plan.tsv" \
            --candidates "$RUNNER_TEMP/retired-manifests"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- manifest/
          if ! git diff --cached --quiet; then
            git commit -m "manifest: retire obsolete bottles ($(date -u +%Y-%m-%d))"
            ./scripts/retry.sh git pull --rebase --autostash
            ./scripts/retry.sh git push
          fi

      - name: Delete retired bottle assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          ./scripts/retry.sh python3 scripts/delete_replaced_assets.py
          --candidates "$RUNNER_TEMP/retired-manifests"

      - name: Capture pipeline baseline
        run: |
          python3 scripts/pipeline_context.py create \
            --output "$RUNNER_TEMP/pipeline-context.json" \
            --stage sync \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload pipeline context
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-context
          path: ${{ runner.temp }}/pipeline-context.json
          retention-days: 7
