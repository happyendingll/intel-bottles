name: build bottles

# Runs after a successful sync-fork, builds Intel (x86_64) bottles on GitHub's
# macos-15-intel runner, and publishes them for a forked homebrew-core to point at.
#
# Work is scheduled in waves by dependency depth. Ordering matters a lot: when everything
# ran concurrently, six qt* jobs each spent ~70 minutes rebuilding qtbase before starting
# their own build. Publishing each wave before the next starts means later jobs pour their
# dependencies instead.

on:
  workflow_dispatch:
    inputs:
      formulae:
        description: Space-separated formulae to build instead of the computed plan
        required: false
        type: string
  workflow_run:
    workflows: ["sync fork"]
    types: [completed]

concurrency:
  group: build-bottles
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  reject-failed-sync:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "sync fork concluded: ${{ github.event.workflow_run.conclusion }}" >&2
          exit 1

  plan:
    name: plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15-intel
    outputs:
      wave0: ${{ steps.plan.outputs.wave0 }}
      wave1: ${{ steps.plan.outputs.wave1 }}
      wave2: ${{ steps.plan.outputs.wave2 }}
      wave3: ${{ steps.plan.outputs.wave3 }}
      wave4: ${{ steps.plan.outputs.wave4 }}
      missing_count: ${{ steps.plan.outputs.missing_count }}
    env:
      HOMEBREW_CORE_GIT_REMOTE: https://github.com/${{ github.repository_owner }}/homebrew-core
      HOMEBREW_NO_INSTALL_FROM_API: 1
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ASK: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - uses: actions/checkout@v7

      - name: Download sync pipeline context
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: pipeline-context
          path: ${{ runner.temp }}/pipeline-context
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create pipeline context for a manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/pipeline-context"
          python3 scripts/pipeline_context.py create \
            --output "$RUNNER_TEMP/pipeline-context/pipeline-context.json" \
            --stage build \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Add build run to pipeline context
        if: github.event_name == 'workflow_run'
        run: |
          python3 scripts/pipeline_context.py conclude \
            "$RUNNER_TEMP/pipeline-context/pipeline-context.json" \
            --stage sync \
            --conclusion "${{ github.event.workflow_run.conclusion }}"
          python3 scripts/pipeline_context.py stamp \
            "$RUNNER_TEMP/pipeline-context/pipeline-context.json" \
            --stage build \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Forward pipeline context
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-context
          path: ${{ runner.temp }}/pipeline-context/pipeline-context.json
          retention-days: 7

      - name: Point Homebrew at the fork
        run: ./scripts/prepare_homebrew.sh

      - name: Compute the build plan
        id: plan
        env:
          OVERRIDE: ${{ inputs.formulae }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys
          sys.path.insert(0, "scripts")
          from plan_targets import runner_for
          names = os.environ["OVERRIDE"].split()
          print(f"wave0={json.dumps([runner_for(n) for n in names])}")
          for i in range(1, 5):
              print(f"wave{i}=[]")
          print(f"missing_count={len(names)}")
          PY
          else
            python3 scripts/plan_targets.py
          fi

  wave0:
    name: wave 0
    needs: plan
    if: needs.plan.outputs.wave0 != '[]' && needs.plan.outputs.wave0 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave0 }}
      stage: wave0
      allow_failure: true
      llvm_single_stage: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave1:
    name: wave 1
    needs: [plan, wave0]
    # always(): a failure in an earlier wave must not strand the rest of the graph. A later
    # job will simply rebuild whatever it still needs from source.
    if: always() && needs.plan.outputs.wave1 != '[]' && needs.plan.outputs.wave1 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave1 }}
      stage: wave1
      allow_failure: true
      llvm_single_stage: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave2:
    name: wave 2
    needs: [plan, wave1]
    if: always() && needs.plan.outputs.wave2 != '[]' && needs.plan.outputs.wave2 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave2 }}
      stage: wave2
      allow_failure: true
      llvm_single_stage: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave3:
    name: wave 3
    needs: [plan, wave2]
    if: always() && needs.plan.outputs.wave3 != '[]' && needs.plan.outputs.wave3 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave3 }}
      stage: wave3
      allow_failure: true
      llvm_single_stage: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  wave4:
    name: wave 4
    needs: [plan, wave3]
    if: always() && needs.plan.outputs.wave4 != '[]' && needs.plan.outputs.wave4 != ''
    uses: ./.github/workflows/_build-stage.yml
    with:
      formulae: ${{ needs.plan.outputs.wave4 }}
      stage: wave4
      allow_failure: true
      llvm_single_stage: true
    secrets:
      FORK_TOKEN: ${{ secrets.FORK_TOKEN }}

  handoff:
    name: hand off to catalog
    needs: [plan, wave0, wave1, wave2, wave3, wave4]
    # A Formula timeout or publish failure may make the workflow non-successful.
    # Reaching this job proves the wave graph entered a terminal state, so catalog
    # generation may continue and the final report can show what needs review.
    # A workflow cancelled before the graph settles never creates this marker.
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Mark the build graph complete
        run: touch "$RUNNER_TEMP/build-complete"

      - uses: actions/upload-artifact@v7
        with:
          name: build-complete
          path: ${{ runner.temp }}/build-complete
          retention-days: 7
